<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Todo App</title>
</head>

<body>
    <div class="container-sm">
        <div class="px-4 py-2 my-2">
            <div class="text-center">
                <i class="fa-regular fa-house fs-32 mb-2"></i>
                <h1 class="display-5 fw-bold text-body-emphasis">Awesome Todo App</h1>
                <p class="lead mb-4">Quickly add your new todos.</p>
            </div>

            <form id="todo-form" class="px-4 py-5 col-lg-6 mx-auto">
                <label for="todo" class="form-label h6">Add Todos</label>
                <input type="text" class="form-control mb-2" id="todo" placeholder="add todos" required>

                <label for="todo-summary" class="form-label h6">Summary</label>
                <textarea class="form-control mb-2" id="todo-summary" placeholder="Summary"></textarea>

                <label for="todo-date" class="form-label h6">Date</label>
                <input type="date" class="form-control mb-2" id="todo-date" required>

                <button type="submit" class="btn btn-primary my-2">Primary</button>
        </div>
    </div>
    

    <div class="list-group list-group-flush border-bottom scrollarea col-lg-5 mx-auto">
        <h3 class="text-center">Todos List...</h3>
        <hr />
        <div id="todo-list">

        </div>
            <div class=" list-group-item list-group-item-action py-3 lh-sm d-flex justify-content-between"
        aria-current="true">
        <div>
            <div class="d-flex w-100 align-items-center justify-content-between">
                <strong class="mb-1">Listgroup item heading</strong>
            </div>
            <div class="col-10 mb-1 small">
                Some placeholder content in a paragraph below the heading and date.
            </div>
        </div>
        <div class="d-flex flex-column gap-1">
            <small class="mb-2">Wed</small>
            <button class="edit bg-success" title="edit"><i class="fa-solid fa-pencil"></i></button>
            <button class="delete bg-danger" title="delete"><i class="fa-solid fa-trash"></i></button>
        </div>
    </div>
    </div>
    </div>

    <script src="./app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
